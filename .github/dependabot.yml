# Weekly update PRs. CI runs on each one, so a green Dependabot PR is safe to merge.
# A dependency joins the first group it matches, so the narrow groups come first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # ESLint and its plugins must move together (majors included), or linting breaks on a version mismatch.
      eslint:
        patterns: [eslint, '@eslint/*', 'eslint-plugin-*', typescript-eslint, globals]
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      # One PR for routine dev-tool bumps. Other majors stay one PR each so a breaking change is easy to spot.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Workflow-only changes, verified by CI itself: one PR for all of them.
      github-actions:
        patterns: ['*']
