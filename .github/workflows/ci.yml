# Runs on every pull request and every push to main. Vercel deploys on its own (Git integration);
# make this job the one required status check on main so nothing merges, or reaches production, red.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only what ships to the browser. Build-tool advisories are left to Dependabot alerts,
      # since they often have no fix yet and never reach users.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
